# Netlify: connect this repo and use these defaults (no secrets here).
# REQUIRED for production API access (set in Netlify UI, then redeploy):
#   Site settings → Environment variables →
#   VITE_API_URL = https://komban-lms-backend.onrender.com/api/v1
# Do NOT set VITE_API_URL to localhost or 127.0.0.1 for production builds.
# After changing it, trigger a new Netlify deploy.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
